name: Sentinel-X Release & GitHub Packages

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to build and publish (e.g. v0.1.6)"
        required: false
        default: "v0.1.6"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write
  packages: write

jobs:
  security-and-tests:
    name: Automated Tests & Anti-REA Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Unit & Integration Test Suite
        run: python3 -m unittest discover -s tests -p "test_*.py" -v

      - name: Run Anti-REA Security Audit
        run: python3 -m sentinel_x.security.release_protection.cli audit --root . --format markdown

      - name: Build Python Wheel, Source Tarball, & Release Bundle
        run: python3 scripts/build_release_package.py --dist-dir dist

      - name: Upload Cross-Platform Release Packages
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-x-release-packages
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.zip
            dist/release_manifest.json

  build-windows-exe:
    name: Build Windows Standalone Executable (.exe)
    runs-on: windows-latest
    needs: security-and-tests
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11 on Windows
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build dist\sentinel-x.exe with Anti-REA Verification
        run: python scripts/build_exe.py --dist-dir dist

      - name: Upload Windows Executable Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-x-windows-exe
          path: |
            dist/sentinel-x.exe
            dist/sentinel-x.exe.sha256
            dist/build_manifest.json

  publish-github-package:
    name: Publish Container Image to GitHub Packages (ghcr.io)
    runs-on: ubuntu-latest
    needs: security-and-tests
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Package to ghcr.io
        run: |
          IMAGE_REPO="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          TAG_NAME="${GITHUB_REF_NAME:-latest}"
          docker build -t "${IMAGE_REPO}:${TAG_NAME}" -t "${IMAGE_REPO}:latest" .
          docker push "${IMAGE_REPO}:${TAG_NAME}"
          docker push "${IMAGE_REPO}:latest"

  publish-github-release:
    name: Publish GitHub Release & Assets
    runs-on: ubuntu-latest
    needs:
      - security-and-tests
      - build-windows-exe
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download Cross-Platform Release Packages
        uses: actions/download-artifact@v4
        with:
          name: sentinel-x-release-packages
          path: release_assets

      - name: Download Windows .exe Artifacts
        uses: actions/download-artifact@v4
        with:
          name: sentinel-x-windows-exe
          path: release_assets

      - name: Generate Combined SHA256SUMS.txt
        run: |
          cd release_assets
          rm -f SHA256SUMS.txt
          sha256sum * > SHA256SUMS.txt

      - name: Publish Release on GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          name: "Sentinel-X ${{ github.event.inputs.release_tag || github.ref_name }}"
          generate_release_notes: true
          files: |
            release_assets/*

